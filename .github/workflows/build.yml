name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Assignment 2 targets net9.0, Assignment 1 targets net10.0 — install both.
      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build Assignment 1
        run: dotnet build Assignment1/TicTacToe/TicTacToe.csproj --configuration Release

      - name: Build Assignment 2
        run: dotnet build Assignment2/TicTacToe/TicTacToe.csproj --configuration Release
